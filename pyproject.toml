[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anthropic-usage"
version = "1.0.0"
description = "Anthropic usage panel widget for XFCE (via xfce4-genmon-plugin)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

# pycairo / PyGObject are intentionally NOT declared here: on Debian/Kali
# they come from apt (python3-gi, python3-cairo, gir1.2-pango-1.0), not pip,
# and render.py imports them lazily so the rest of the package works without
# them. `make deps` checks for the apt packages.

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
anthropic-usage = "anthropic_usage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
